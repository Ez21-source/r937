<style>
/* Layout: sticky toolbar, report tabs strip, then one report at a time — each section is a card with the two periods side by side (stacked on phones). */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#E4ECEA; --ink:#13211F; --muted:#5A6C69; --line:#D3DEDB;
  --accent:#0B6B5D; --accent-ink:#FFFFFF; --accent-soft:#D6ECE7;
  --p0:#66778C; --p0-soft:#E3E8EF;
  --good:#1D7A4C; --bad:#B4432D; --warn:#A86E12;
  --focus:#0B6B5D;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  /* report paper: always light, it is what gets exported */
  --s-bg:#FFFFFF; --s-ink:#16211F; --s-muted:#5E6E6B; --s-line:#DCE5E3; --s-band:#F1F6F5; --s-accent:#0B6B5D; --s-accent-soft:#CFE6E0; --s-p0:#7A8AA0; --s-p0-soft:#E2E7EE;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#14201E; --surface-2:#1B2A28; --ink:#E2EDEB; --muted:#93A7A3; --line:#273936;
  --accent:#3DB59F; --accent-ink:#06201B; --accent-soft:#17362F; --p0:#93A3B8; --p0-soft:#232E3A;
  --good:#4CC28A; --bad:#EE7C64; --warn:#E0A84A; --focus:#3DB59F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#14201E; --surface-2:#1B2A28; --ink:#E2EDEB; --muted:#93A7A3; --line:#273936;
  --accent:#3DB59F; --accent-ink:#06201B; --accent-soft:#17362F; --p0:#93A3B8; --p0-soft:#232E3A;
  --good:#4CC28A; --bad:#EE7C64; --warn:#E0A84A; --focus:#3DB59F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand-mark{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 9px;line-height:1.3}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body);font-weight:400}
.save-state{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.55;cursor:progress}
.menu-wrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,30,25,.16);padding:6px;min-width:250px;z-index:30;display:grid}
.menu button{border:0;background:none;text-align:start;padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.menu button:hover{background:var(--surface-2)}
.menu button span:last-child{color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tab{border:1px solid transparent;background:none;border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.tab.weekly{font-weight:600}
.tab.add{color:var(--accent);border:1px dashed var(--line)}

main{padding-block:20px 60px}
.rep-head{display:grid;gap:14px;grid-template-columns:1fr auto;align-items:start}
.rep-name{font-family:var(--f-display);font-size:26px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 8px;margin-inline-start:-8px;width:100%;min-width:0}
.rep-name:hover{border-color:var(--line)}
.rep-name:focus{background:var(--surface);border-color:var(--accent);outline:none}
.rep-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.rep-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.periods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.period-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.period-box .dot{width:10px;height:10px;border-radius:50%}
.p0 .dot{background:var(--p0)} .p1 .dot{background:var(--accent)}
.field{display:grid;gap:2px;min-width:0}
.field label{font-size:11.5px;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.viewswitch{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;margin-top:18px}
.viewswitch button{border:0;background:none;padding:6px 16px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.viewswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .vals{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .now{font-family:var(--f-display);font-size:24px;font-weight:600}
.kpi .was{color:var(--muted);font-size:13px}
.delta{direction:ltr;unicode-bidi:isolate;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.delta.up-good,.delta.down-good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.delta.up-bad,.delta.down-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.delta.flat{color:var(--muted);background:var(--surface-2)}

.group-title{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font-family:var(--f-display);font-size:18px;font-weight:600}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sections{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{margin:0;font-size:15px;font-weight:600;margin-inline-end:auto}
.metric-tag{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px}
.card-body{display:grid;grid-template-columns:1fr 1fr}
.pcol{padding:12px 14px;min-width:0;display:grid;gap:10px;align-content:start}
.pcol + .pcol{border-inline-start:1px solid var(--line)}
.pcol-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.pcol-head .dot{width:9px;height:9px;border-radius:50%}
.pcol.p0 .pcol-head{color:var(--p0)} .pcol.p1 .pcol-head{color:var(--accent)}
.pcol-head .count{color:var(--muted);font-weight:400;margin-inline-start:auto;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.summary .total-inp{font-family:var(--f-display);font-weight:600;font-size:18px;max-width:200px}
.sum-hint{font-size:11.5px;color:var(--muted)}
.sum-hint.warn{color:var(--warn);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.edit{width:100%;border-collapse:collapse}
table.edit th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:start;padding:2px 4px 6px;white-space:nowrap}
table.edit td{padding:2px}
table.edit td.idx{color:var(--muted);font-size:11px;width:20px;text-align:center}
table.edit input{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;min-width:0}
table.edit input:hover{border-color:var(--line)}
table.edit input:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
table.edit input.num{text-align:center;width:78px}
table.edit td.nm{min-width:180px}
table.edit tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
/* v7: divided entry grid */
table.edit{border:1px solid var(--line);border-collapse:separate;border-spacing:0;border-radius:10px;background:var(--surface)}
table.edit th{background:var(--surface-2);color:var(--ink);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:normal;line-height:1.3;min-width:86px;vertical-align:bottom}
table.edit th:first-child{border-start-start-radius:10px} table.edit th:last-child{border-start-end-radius:10px}
table.edit th:nth-child(2){text-align:start;min-width:170px}
table.edit th:first-child,table.edit th:last-child{min-width:0}
table.edit th+th,table.edit td+td{border-inline-start:1px solid var(--line)}
table.edit td{padding:4px;border-bottom:1px solid var(--line);background:var(--surface)}
table.edit tr:last-child td{border-bottom:0}
table.edit tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
table.edit input{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--bg);padding:7px 8px}
table.edit input.num{width:100%;min-width:76px}
table.edit td.idx{width:30px;min-width:30px;font-weight:600}
table.edit td.idx,table.edit th:first-child{position:sticky;right:0;z-index:2}
table.edit td.nm,table.edit th:nth-child(2){position:sticky;right:30px;z-index:2;box-shadow:-6px 0 8px -6px rgba(0,0,0,.18)}
table.edit th:first-child,table.edit th:nth-child(2){z-index:3}
.pcol .tbl-wrap{border-radius:10px}
@media (max-width:700px){ table.edit td.nm{min-width:150px} table.edit th:nth-child(2){min-width:150px} }
.rm{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;width:26px;height:26px;display:grid;place-items:center}
.rm:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.rm svg{width:14px;height:14px}
.pcol-foot{display:flex;gap:6px;flex-wrap:wrap}
.empty-note{color:var(--muted);font-size:13px;padding:6px 2px}

/* preview */
.preview-scroll{overflow-x:auto;margin-top:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:16px}
.preview-scroll .sheet{margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}

/* the report paper (exported) */
.sheet{width:1000px;background:var(--s-bg);color:var(--s-ink);font-family:var(--f-body);direction:rtl;padding:28px 32px;font-size:13px;line-height:1.5}
.sheet .blk{padding-bottom:18px;background:var(--s-bg)}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--s-accent);padding-bottom:12px;margin-bottom:16px}
.sh-top .org{font-size:12px;color:var(--s-muted);font-weight:500}
.sh-top h2{font-family:var(--f-display);font-size:26px;margin:2px 0 0;font-weight:600;color:var(--s-ink)}
.sh-per{display:flex;gap:16px;font-size:12.5px}
.sh-per div{display:flex;align-items:center;gap:6px}
.sh-per i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sh-per .d{color:var(--s-muted)}
.sh-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sh-kpi{border:1px solid var(--s-line);border-radius:8px;padding:10px 14px;background:var(--s-band)}
.sh-kpi .l{font-size:12px;color:var(--s-muted)}
.sh-kpi .v{display:flex;align-items:baseline;gap:10px}
.sh-kpi .v b{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--s-accent)}
.sh-kpi .v span{color:var(--s-muted)}
.sh-kpi .dl{direction:ltr;unicode-bidi:isolate;font-size:11.5px;font-weight:600}
.dl.g{color:#1D7A4C} .dl.b{color:#B4432D} .dl.f{color:var(--s-muted)}
.sh-group{font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--s-accent);margin:6px 0 10px;display:flex;align-items:center;gap:10px}
.sh-group::after{content:"";flex:1;height:1px;background:var(--s-line)}
.sh-sec{border:1px solid var(--s-line);border-radius:8px;overflow:hidden}
.sh-sec h4{margin:0;padding:8px 14px;background:var(--s-band);font-size:14px;font-weight:600;border-bottom:1px solid var(--s-line);display:flex;justify-content:space-between;gap:10px}
.sh-sec h4 small{font-weight:500;color:var(--s-muted);font-size:12px}
.sh-cols{display:grid;grid-template-columns:1fr 1fr}
.sh-col{padding:10px 14px;min-width:0}
.sh-col + .sh-col{border-right:1px solid var(--s-line)}
.sh-col .ph{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sh-col .ph i{width:9px;height:9px;border-radius:3px}
.sh-col.c0 .ph{color:var(--s-p0)} .sh-col.c0 .ph i{background:var(--s-p0)}
.sh-col.c1 .ph{color:var(--s-accent)} .sh-col.c1 .ph i{background:var(--s-accent)}
.sh-sum{display:flex;gap:14px;flex-wrap:wrap;background:var(--s-band);border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:12px;color:var(--s-muted)}
.sh-sum b{color:var(--s-ink);font-size:14px;margin-inline-start:4px}
table.sh{width:100%;border-collapse:collapse;font-size:12px}
table.sh th{color:var(--s-muted);font-weight:500;text-align:start;border-bottom:1px solid var(--s-line);padding:3px 4px}
table.sh td{padding:4px;border-bottom:1px solid var(--s-band);vertical-align:middle}
table.sh td.n{text-align:center;white-space:nowrap;width:64px;font-weight:500}
table.sh td.bar{width:90px}
.barline{height:7px;border-radius:4px;background:var(--s-band);overflow:hidden}
.barline span{display:block;height:100%;border-radius:4px}
.c0 .barline span{background:var(--s-p0)} .c1 .barline span{background:var(--s-accent)}
.sh-none{color:var(--s-muted);font-size:12px;padding:6px 0}
/* v7: single comparison table */
.cmp-sum{display:flex;gap:8px 22px;flex-wrap:wrap;padding:8px 14px;background:var(--s-band);border-bottom:1px solid var(--s-line);font-size:12px;color:var(--s-muted);align-items:center}
.cmp-sum b{color:var(--s-ink);font-size:14px;margin-inline:4px}
.cmp-sum .pv{margin-inline-end:6px}
.cmp-sum .dl,table.cmpt td .dl{direction:ltr;unicode-bidi:isolate;font-weight:600;font-size:11.5px;white-space:nowrap}
.dl.n{color:#2F5E9E;direction:rtl!important}
table.cmpt th,table.cmpt td{padding:5px 10px}
table.cmpt tr.h1 th{white-space:nowrap;font-size:11.5px;font-weight:600;border-bottom:0;padding-top:9px;padding-bottom:2px}
table.cmpt th.pc1{color:var(--s-accent);text-align:center;box-shadow:inset 0 -2px 0 var(--s-accent)}
table.cmpt th.pc0{color:var(--s-p0);text-align:center;box-shadow:inset 0 -2px 0 var(--s-p0)}
table.cmpt th.leg{font-weight:500;color:var(--s-muted)}
table.cmpt th.leg span{display:inline-flex;align-items:center;gap:5px;margin-inline-end:12px}
table.cmpt th.leg i{width:12px;height:7px;border-radius:2px;display:inline-block}
i.c1{background:var(--s-accent)} i.c0{background:var(--s-p0)}
table.cmpt th.n{text-align:center}
table.cmpt .rk{width:22px;text-align:center;color:var(--s-muted)}
table.cmpt td.m{font-weight:700;color:var(--s-ink)}
table.cmpt td.pv{color:var(--s-muted)}
table.cmpt td.ch{width:210px}
table.cmpt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--s-band) 55%,transparent)}
.b2{height:9px;border-radius:4px;background:var(--s-band);overflow:hidden}
.b2.thin{height:5px}
table.cmpt td.ch{width:250px}
.chr{display:flex;align-items:center;gap:6px} .chr+.chr{margin-top:2px}
.chr .b2{flex:1}
.chr i{font-style:normal;font-size:10px;color:var(--s-muted);width:40px;text-align:start;line-height:1;white-space:nowrap}
table.cmpt th small{font-weight:400;font-size:10px;color:var(--s-muted)}
.b2 span{display:block;height:100%;border-radius:4px}
.b2 .c1{background:var(--s-accent)} .b2 .c0{background:var(--s-p0)}
.sh-foot{color:var(--s-muted);font-size:11px;border-top:1px solid var(--s-line);padding-top:8px;display:flex;justify-content:space-between}
#exportHolder{position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;z-index:-1;pointer-events:none}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--surface);border-radius:14px;max-width:460px;width:100%;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.dialog p{margin:0;color:var(--muted)}
.dialog .acts{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:4px}
.dialog ul{margin:0;padding-inline-start:18px;max-height:180px;overflow:auto;color:var(--muted)}

function defsOf(type){

function newReport(type, name){
  const r={id:uid(), name:name||TYPES[type].label, type, periods:TYPES[type].periods.map(l=>({label:l,date:''})), sections:{}};
  defsOf(type).forEach(d=>{ r.sections[d.key]={p:[emptyPeriod(),emptyPeriod()]}; });
  return r;
}
function normalizeReport(r){
  if(r.type==='quarterly') return normQ(r);
  if(!TYPES[r.type]) r.type='hospital';
  r.id = r.id || uid();
  r.periods = (r.periods||[]).slice(0,2);
  while(r.periods.length<2) r.periods.push({label:TYPES[r.type].periods[r.periods.length],date:''});
  r.sections = r.sections||{};
  defsOf(r.type).forEach(d=>{
    const s = r.sections[d.key] = r.sections[d.key]||{p:[]};
    s.p = s.p||[]; while(s.p.length<2) s.p.push(emptyPeriod());
    s.p.forEach(p=>{p.summary=p.summary||{}; p.rows=p.rows||[];});
  });
  satCountFill(r);
  return r;
}

  const C=r.sections[d.entity+'-count'], S=r.sections[d.key]; if(!C||!S) return;

    p.rows.forEach(x=>{ if(x.count==null&&String(x.name||'').trim()&&M.has(fold(x.name))) x.count=M.get(fold(x.name)); }); }); }); }

function toNum(v, ratio){
  if(v===null||v===undefined||v==='') return null;
  let n, pct=false;
  if(typeof v==='number') n=v;
  else{
    let s=String(v).trim();
    s=s.replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660)).replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x6F0));
    s=s.replace(/٫/g,'.').replace(/[٬,\s]/g,'');
    if(/[%٪]/.test(s)) pct=true;
    s=s.replace(/[^0-9.\-]/g,'');
    if(s===''||s==='-'||s==='.') return null;
    n=parseFloat(s);
    if(isNaN(n)) return null;
    if(pct) n/=100;
  }
  if(ratio && !pct && n>1.5) n/=100;
  return Math.round(n*1e6)/1e6;
}

function inputVal(k,v){ if(v==null) return ''; if(RATIO.has(k)) return String(+(v*100).toFixed(2)); return String(v); }
function fromInput(k,s){ const n=toNum(s,false); if(n==null) return null; return RATIO.has(k) ? n/100 : n; }

let hist=[], fut=[], lastSnap=null, snapT=null, savedStr=null;

}

}

/* ---------- derived ---------- */
function sumRows(p, k){ let s=0, any=false; p.rows.forEach(r=>{ if(typeof r[k]==='number'){ s+=r[k]; any=true; } }); return any? s : null; }
function totalOf(p){ return (typeof p.summary.total==='number') ? p.summary.total : sumRows(p,'count'); }
function totalHint(p){
  const s=sumRows(p,'count'), t=p.summary.total;
  if(typeof t!=='number') return {txt:`فارغ = مجموع الجدول (${fmtInt(s)})`, warn:false};
  if(s!=null && Math.round(s)!==Math.round(t)) return {txt:`مجموع الجدول ${fmtInt(s)} · يختلف عن الإجمالي`, warn:true};
  return {txt:`يطابق مجموع الجدول`, warn:false};
}
function kpisOf(rep){
  if(rep.type==='quarterly'){ const S=rep.qs.filter(q=>q.show), a=S.length>1?qTot(S[S.length-2]):{}, b=S.length?qTot(S[S.length-1]):{};
    return {total:[a.count??null,b.count??null], sat:[a.sat??null,b.sat??null], sl:[null,null]}; }
  const defs=defsOf(rep.type).filter(d=>d.group===0);
  const cnt=defs.find(d=>d.metric==='count'), sat=defs.find(d=>d.metric==='sat'), sl=defs.find(d=>d.metric==='sl');
  const S=k=>rep.sections[k].p;
  return {
    total:[0,1].map(i=>totalOf(S(cnt.key)[i])),
    sat:[0,1].map(i=>S(sat.key)[i].summary.avg ?? null),
    sl:[0,1].map(i=>S(sl.key)[i].summary.overall ?? null)
  };
}
function deltaInfo(a,b,higherIsGood,ratio){
  if(a==null||b==null) return null;
  const d=b-a;
  let txt;
  if(ratio) txt=(d>0?'+':'')+(d*100).toFixed(1)+' نقطة';
  else{ if(a===0) txt=(d>0?'+':'')+fmtInt(d); else txt=(d>0?'+':'')+(d/a*100).toFixed(1)+'%'; }
  let cls='flat';
  if(Math.abs(d)>1e-9){ const up=d>0; cls = up ? (higherIsGood?'up-good':'up-bad') : (higherIsGood?'down-bad':'down-good'); }
  return {txt, cls};
}

  const el=document.createElement('div'); el.className='sheet';
  const k=kpisOf(rep);
  const dl=(a,b,good,ratio)=>{ const d=deltaInfo(a,b,good,ratio); if(!d) return ''; const c=d.cls==='flat'?'f':(d.cls.endsWith('good')?'g':'b'); return `<span class="dl ${c}">${d.txt}</span>`; };
  const kp=(l,v,ratio,good)=>`<div class="sh-kpi"><div class="l">${l}</div><div class="v"><b>${ratio?fmtPct(v[1]):fmtInt(v[1])}</b><span>${esc(rep.periods[0].label)}: ${ratio?fmtPct(v[0]):fmtInt(v[0])}</span>${dl(v[0],v[1],good,ratio)}</div></div>`;
  const perTxt=rep.periods.map((p,i)=>`<div><i style="background:${i?'var(--s-accent)':'var(--s-p0)'}"></i><b>${esc(p.label)}</b>${p.date?`<span class="d">${esc(p.date)}</span>`:''}</div>`).join('');
  let html=`<div class="blk"><div class="sh-top"><div><div class="org">تقرير بلاغات 937 · ${TYPES[rep.type].label}</div><h2>${esc(rep.name)}</h2></div><div class="sh-per">${perTxt}</div></div>
    <div class="sh-kpis">${kp('اجمالي البلاغات',k.total,false,false)}${kp('متوسط رضا المستفيد',k.sat,true,true)}${kp('نسبة البلاغات داخل مستوى الخدمة',k.sl,true,true)}</div></div>`;
  const defs=defsOf(rep.type);
  const lim=rows=> state.rf && state.rf.limit>0 ? rows.slice(0,state.rf.limit) : rows;
  TYPES[rep.type].groups.forEach((g,gi)=>{
    if(state.rf && state.rf.hideGroups.includes(g.title)) return;
    defs.filter(d=>d.group===gi).forEach((d,si)=>{
      const sec=rep.sections[d.key];
      const main=d.cols.includes('pct')?'pct':(d.cols.includes('count')?'count':'avg');
      const max=Math.max(1e-9,...sec.p.flatMap(p=>p.rows.map(r=>r[main]||0)));
      if(!state.rf || state.rf.cmp!=='two'){ html+=`<div class="blk">${si===0?`<div class="sh-group">${g.title}</div>`:''}${cmpSection(rep,d,lim)}</div>`; return; }
      const cols=[0,1].map(pi=>{
        const p=sec.p[pi];
        let sum='';
        if(d.total) sum=`<div class="sh-sum">اجمالي البلاغات<b>${fmtInt(totalOf(p))}</b></div>`;
        else if(d.summary && d.metric==='sat') sum=`<div class="sh-sum">${['avg','comm','proc'].map(k=>`<span>${KLABEL[k]}<b>${fmtPct(p.summary[k])}</b></span>`).join('')}</div>`;
        else if(d.summary && d.metric==='sl') sum=`<div class="sh-sum">داخل مستوى الخدمة<b>${fmtPct(p.summary.overall)}</b></div>`;
        const ratioMax = RATIO.has(main)?1:max;
        const tb=p.rows.length?`<table class="sh"><thead><tr><th>${ENT[d.entity].name}</th>${d.cols.map(k=>`<th style="text-align:center">${colLabel(d.entity,d.metric,k)}</th>`).join('')}<th></th></tr></thead><tbody>${
          lim(p.rows).map(r=>`<tr><td>${esc(r.name)}</td>${d.cols.map(k=>`<td class="n">${fmtVal(k,r[k])}</td>`).join('')}<td class="bar"><div class="barline"><span style="width:${Math.max(0,Math.min(100,(r[main]||0)/ratioMax*100)).toFixed(1)}%"></span></div></td></tr>`).join('')
        }</tbody></table>`:`<div class="sh-none">لا توجد بيانات</div>`;
        return `<div class="sh-col c${pi}"><div class="ph"><i></i>${esc(rep.periods[pi].label)}${rep.periods[pi].date?` · ${esc(rep.periods[pi].date)}`:''}</div>${sum}${tb}</div>`;
      }).join('');
      html+=`<div class="blk">${si===0?`<div class="sh-group">${g.title}</div>`:''}<div class="sh-sec"><h4>${esc(d.title)}<small>${METRIC_NAME[d.metric]}</small></h4><div class="sh-cols">${cols}</div></div></div>`;
    });
  });
  const now=new Date();
  html+=`<div class="blk sh-foot-blk"><div class="sh-foot"><span>${esc(rep.name)} · ${esc(rep.periods[0].label)} مقابل ${esc(rep.periods[1].label)}</span><span>أُعدّ في ${now.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn')}</span></div></div>`;
  el.innerHTML=html;
  return el;
}

/* one table per section: current period values, previous value, change, and an in-row comparison chart */
function cmpSection(rep,d,lim){
  const sec=rep.sections[d.key], P=rep.periods, p1=sec.p[1], p0=sec.p[0];
  const main=d.metric==='count'?'count':(d.metric==='sl'?'pct':'avg'), isR=RATIO.has(main);
  const prev=new Map(p0.rows.filter(r=>String(r.name||'').trim()).map(r=>[fold(r.name),r]));
  const rows=lim(p1.rows.filter(r=>String(r.name||'').trim()));
  const mx=isR?1:Math.max(1e-9,...rows.flatMap(r=>{ const q=prev.get(fold(r.name)); return [r[main]||0,q?(q[main]||0):0]; }));
  const dl=(a,b,good=isR,ratio=isR)=>{ const x=deltaInfo(a,b,good,ratio); if(!x) return '<span class="dl f">—</span>';
    if(x.cls==='flat') return '<span class="dl f">● 0</span>';
    return `<span class="dl ${x.cls.endsWith('good')?'g':'b'}"${ratio?' style="direction:rtl"':''}>${b>a?'▲':'▼'} ${x.txt.replace(/^[+-]/,'')}</span>`; };
  const sv=(a,b,r)=>`<b>${r?fmtPct(b):fmtInt(b)}</b><span class="pv">${esc(P[0].label)}: ${r?fmtPct(a):fmtInt(a)}</span>`;
  let sum='';
  if(d.total) sum=`<div class="cmp-sum"><span>اجمالي البلاغات ${sv(totalOf(p0),totalOf(p1),false)} ${dl(totalOf(p0),totalOf(p1),false,false)}</span></div>`;
  else if(d.summary && d.metric==='sat') sum=`<div class="cmp-sum">${['avg','comm','proc'].map(k=>{ const a=p0.summary[k], b=p1.summary[k]; return `<span>${KLABEL[k]} ${sv(a,b,true)} ${a!=null&&b!=null?dl(a,b,true,true):''}</span>`; }).join('')}</div>`;
  else if(d.summary && d.metric==='sl'){ const a=p0.summary.overall, b=p1.summary.overall; sum=`<div class="cmp-sum"><span>داخل مستوى الخدمة ${sv(a,b,true)} ${a!=null&&b!=null?dl(a,b,true,true):''}</span></div>`; }
  const n=d.cols.length;
  const head=`<thead><tr class="h1"><th colspan="2"></th><th colspan="${n}" class="pc1">${esc(P[1].label)}</th><th>التغيّر</th><th class="leg"><span><i class="c1"></i>${esc(P[1].label)}</span><span><i class="c0"></i>${esc(P[0].label)}</span></th></tr>
    <tr><th class="rk">#</th><th>${ENT[d.entity].name}</th>${d.cols.map(k=>`<th class="n">${colLabel(d.entity,d.metric,k)}</th>`).join('')}<th class="n">عن ${esc(P[0].label)}</th><th>المقارنة <small>(الرقم الصغير = ${esc(P[0].label)})</small></th></tr></thead>`;
  const body=rows.map((r,i)=>{ const q=prev.get(fold(r.name)), a=q?q[main]:null, b=r[main];
    const w=v=>Math.max(0,Math.min(100,(v||0)/mx*100)).toFixed(1);
    return `<tr><td class="rk">${i+1}</td><td class="nm">${esc(r.name)}</td>${d.cols.map(k=>`<td class="n${k===main?' m':''}">${fmtVal(k,r[k])}</td>`).join('')}<td class="n">${a==null?'<span class="dl n">جديد</span>':dl(a,b)}</td><td class="ch"><div class="chr"><div class="b2"><span class="c1" style="width:${w(b)}%"></span></div><i></i></div><div class="chr"><div class="b2 thin"><span class="c0" style="width:${a==null?0:w(a)}%"></span></div><i>${a==null?'':fmtVal(main,a)}</i></div></td></tr>`; }).join('');
  return `<div class="sh-sec cmp"><h4>${esc(d.title)}<small>${METRIC_NAME[d.metric]} · ${esc(P[1].label)} مقارنةً بـ ${esc(P[0].label)}</small></h4>${sum}${rows.length?`<table class="sh cmpt">${head}<tbody>${body}</tbody></table>`:`<div class="sh-none" style="padding:8px 14px">لا توجد بيانات في ${esc(P[1].label)}</div>`}</div>`;
}

/* ---------- events ---------- */
function onInput(e){
  const t=e.target, rep=cur();
  if(t.id==='sideQ'){ sideQ=t.value; renderSideList(); return; }
  if(onInputV2(t)) return;
  if(t.id==='repName'){ rep.name=t.value; const tb=document.querySelector(`#sideList [data-tab="${state.current}"] .nm`); if(tb) tb.textContent=t.value||'بدون اسم'; save(); return; }
  if(t.dataset.per!=null){ rep.periods[+t.dataset.per][t.dataset.pf]=t.value; document.querySelectorAll(`.pcol.p${t.dataset.per} .pcol-head`).forEach(h=>{ h.childNodes[1].textContent=t.value; }); renderKpis(); save(); return; }
  if(t.dataset.sec){
    const p=rep.sections[t.dataset.sec].p[+t.dataset.p];
    if(t.dataset.sum){ p.summary[t.dataset.sum]=fromInput(t.dataset.sum,t.value); }
    else{
      const row=p.rows[+t.dataset.r], k=t.dataset.k;
      row[k] = k==='name' ? t.value : fromInput(k,t.value);
    }
    refreshTotalHint(t.dataset.sec,+t.dataset.p);
    renderKpis(); save();
  }
}
function refreshTotalHint(key,pi){
  const el=document.querySelector(`[data-hint="${key}:${pi}"]`); if(!el) return;
  const p=cur().sections[key].p[pi], h=totalHint(p);
  el.textContent=h.txt; el.classList.toggle('warn',h.warn);
  const inp=document.getElementById(`s-${key}-${pi}-total`); if(inp) inp.placeholder=fmtInt(sumRows(p,'count'));
}
function onClick(e){
  const b=e.target.closest('button'); if(!b) return;
  const rep=cur();
  if(onClickV2(b)) return;
  if(b.dataset.tab!=null){ state.current=+b.dataset.tab; if(view==='panel') view='edit'; closeSide(); save(); renderTabs(); renderMain(); window.scrollTo({top:0}); return; }
  if(b.id==='btnAddRep'){ closeSide(); askNewReport(); return; }
  if(b.dataset.view){ view=b.dataset.view==='preview'?'report':b.dataset.view; closeSide(); saveUI(); renderTabs(); renderMain(); window.scrollTo({top:0}); return; }
  const sp=s=>{ const [k,p,r]=s.split(':'); return {sec:rep.sections[k],k,p:+p,r:r!=null?+r:null}; };
  if(b.dataset.add){ const o=sp(b.dataset.add); o.sec.p[o.p].rows.push({name:''}); save(); renderBody(); const ri=o.sec.p[o.p].rows.length-1; const inp=document.getElementById(`c-${o.k}-${o.p}-${ri}-name`); if(inp) inp.focus(); return; }
  if(b.dataset.rm){ const o=sp(b.dataset.rm); o.sec.p[o.p].rows.splice(o.r,1); save(); renderBody(); renderKpis(); return; }
  if(b.dataset.sort){
    const o=sp(b.dataset.sort); const d=defsOf(rep.type).find(x=>x.key===o.k);
    const main=d.cols.includes('pct')?'pct':(d.cols.includes('count')?'count':'avg');
    const rows=o.sec.p[o.p].rows; const v=r=>r[main]??-Infinity;
    const isDesc=rows.every((r,i)=>i===0||v(rows[i-1])>=v(r));
    rows.sort((a,c)=> isDesc ? v(a)-v(c) : v(c)-v(a));
    save(); renderBody(); toast(isDesc?'رُتّبت تصاعدياً':'رُتّبت تنازلياً'); return;
  }
  if(b.dataset.copynames){
    const o=sp(b.dataset.copynames); const src=o.sec.p[1-o.p].rows; const dst=o.sec.p[o.p].rows;
    const have=new Set(dst.map(r=>r.name.trim()));
    let n=0; src.forEach(r=>{ if(r.name.trim() && !have.has(r.name.trim())){ dst.push({name:r.name}); n++; } });
    save(); renderBody(); toast(n?`أضيف ${n} اسم`:'كل الأسماء موجودة مسبقاً'); return;
  }
  if(b.dataset.act==='dup'){ const c=JSON.parse(JSON.stringify(rep)); c.id=uid(); c.name=rep.name+' (نسخة)'; state.reports.splice(state.current+1,0,c); state.current++; save(); renderTabs(); renderMain(); toast('أُنشئت نسخة من التقرير'); return; }
  if(b.dataset.act==='del'){
    if(state.reports.length===1){ toast('لا يمكن حذف التقرير الوحيد'); return; }
    dialog({title:`حذف «${rep.name}»؟`, body:'ستُحذف كل بيانات هذا التقرير من النموذج. يمكنك تصدير نسخة Excel قبل الحذف.', actions:[{label:'حذف التقرير',cls:'primary',run:()=>{ state.reports.splice(state.current,1); state.current=Math.max(0,state.current-1); save(); renderTabs(); renderMain(); toast('حُذف التقرير'); }},{label:'إلغاء'}]});
    return;
  }
  if(b.dataset.act==='roll'){
    dialog({title:'بدء فترة جديدة؟', body:`ستنتقل بيانات «${rep.periods[1].label}» إلى الفترة السابقة، وتُفرَّغ الفترة الحالية مع إبقاء الأسماء جاهزة للإدخال. البيانات الحالية للفترة السابقة «${rep.periods[0].label}» ستُستبدل.`, actions:[{label:'بدء فترة جديدة',cls:'primary',run:()=>{
      rep.periods[0]={...rep.periods[1]}; rep.periods[1]={label:rep.periods[1].label,date:''};
      Object.values(rep.sections).forEach(s=>{ s.p[0]=JSON.parse(JSON.stringify(s.p[1])); s.p[1]={summary:{},rows:s.p[1].rows.map(r=>({name:r.name}))}; });
      save(); renderMain(); toast('جاهز لإدخال الفترة الجديدة'); }},{label:'إلغاء'}]});
    return;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('click',onClick);
document.addEventListener('focusout',e=>{
  const t=e.target; if(!(t instanceof HTMLInputElement)) return;
  const k=t.dataset.k||t.dataset.sum; if(!k||k==='name') return;
  const rep=cur(); const p=rep.sections[t.dataset.sec].p[+t.dataset.p];
  const v = t.dataset.sum ? p.summary[k] : p.rows[+t.dataset.r][k];
  t.value=inputVal(k,v);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter' && t instanceof HTMLInputElement && t.dataset.r!=null){
    e.preventDefault();
    const sec=t.dataset.sec,p=t.dataset.p,r=+t.dataset.r,k=t.dataset.k;
    const next=document.getElementById(`c-${sec}-${p}-${r+1}-${k}`);
    if(next){ next.focus(); next.select(); }
    else{ cur().sections[sec].p[+p].rows.push({name:''}); save(); renderBody(); const n=document.getElementById(`c-${sec}-${p}-${r+1}-name`); if(n) n.focus(); }
  }
  if((e.ctrlKey||e.metaKey) && !e.altKey){
    const k=e.key.toLowerCase(), inField=(t instanceof HTMLInputElement && !['checkbox','radio','color'].includes(t.type)) || t instanceof HTMLTextAreaElement;
    if(k==='s'){ e.preventDefault(); saveNow(); return; }
    if(!inField && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(!inField && k==='y'){ e.preventDefault(); redo(); return; }
  }
  if(e.key==='Escape'){ closeSide(); closeMenus(); const l=document.getElementById('layer'); if(l.firstChild && l.firstChild.classList.contains('scrim')) l.innerHTML=''; }
});

/* ---------- dialogs / toast ---------- */
function dialog({title, body, html, actions}){

  layer.innerHTML=`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3>${body?`<p>${esc(body)}</p>`:''}${html||''}<div class="acts">${actions.map((a,i)=>`<button type="button" class="btn ${a.cls||''}" data-dlg="${i}">${esc(a.label)}</button>`).join('')}</div></div></div>`;

  scrim.addEventListener('click',e=>{
    if(e.target===scrim){ layer.innerHTML=''; return; }
    const b=e.target.closest('[data-dlg]'); if(!b) return;
    const a=actions[+b.dataset.dlg]; const keep = a.run ? a.run(scrim)===false : false;

  });

/* ---------- library loading ---------- */
const LIBS={
  jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  pdflib:'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
  h2i:'https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js'
};
const libGlobals={jszip:'JSZip',pdflib:'PDFLib',h2i:'htmlToImage'};
const libP={};
function lib(name){
  if(window[libGlobals[name]]) return Promise.resolve(window[libGlobals[name]]);
  return libP[name] = libP[name] || new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIBS[name]; s.onload=()=>res(window[libGlobals[name]]); s.onerror=()=>{ delete libP[name]; rej(new Error('تعذر تحميل مكتبة التصدير، تحقق من الاتصال بالإنترنت')); }; document.head.appendChild(s); });
}

/* ---------- file save ---------- */
let dlNS;
async function downloadsNS(){
  if(dlNS!==undefined) return dlNS;
  try{ dlNS = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ dlNS=null; }
  return dlNS;
}
async function saveFile(filename, blob){
  const ns=await downloadsNS();
  if(ns){
    try{ await ns.save({filename, data:blob}); toast('تم حفظ الملف'); }
    catch(e){ if(e && e.code==='declined') toast('أُلغي الحفظ'); else if(e && e.code==='rate_limited') toast('هناك نافذة حفظ مفتوحة، أكملها ثم أعد المحاولة'); else toast('تعذر حفظ الملف في هذا العرض'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
  toast('بدأ تنزيل الملف');
}
const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g,'-').trim()||'تقرير';
const stamp = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

async function runExport(kind){
  const btn=document.getElementById('btnExport'); btn.disabled=true; const old=btn.innerHTML; btn.lastChild.textContent=' جارٍ التجهيز…';

async function snap(node,ratio=2){

async function buildPdf(reports){
  const PDFLib=await lib('pdflib');

  const W=595.28, H=841.89, M=26;
  for(const rep of reports){
    if(rep.type==='quarterly'){ await withNode(buildInfo(rep), async n=>{ const cv=await snap(n,Math.min(2.5,imgRatio(n))); const img=await pdf.embedPng(new Uint8Array(await (await canvasBlob(cv)).arrayBuffer()));

    await withSheet(rep, async sh=>{
      const blocks=[...sh.querySelectorAll('.blk')];
      let page=pdf.addPage([W,H]), y=H-M;
      for(const b of blocks){
        const c=await snap(b,3);
        const img=await pdf.embedPng(new Uint8Array(await (await canvasBlob(c)).arrayBuffer()));
        let s=(W-2*M)/c.width, h=c.height*s, w=W-2*M;
        if(h>H-2*M){ s=(H-2*M)/c.height; h=H-2*M; w=c.width*s; }
        if(y-h < M){ page=pdf.addPage([W,H]); y=H-M; }
        page.drawImage(img,{x:(W-w)/2, y:y-h, width:w, height:h});
        y-=h;
      }
    });
  }
  pdf.setTitle('تقرير بلاغات 937');
  return new Blob([await pdf.save()],{type:'application/pdf'});
}

  z.file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${names.map((n,i)=>`<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);

function refToRC(ref){ const m=/^([A-Z]+)(\d+)$/.exec(ref); if(!m) return null; let c=0; for(const ch of m[1]) c=c*26+(ch.charCodeAt(0)-64); return {r:+m[2], c:c-1}; }

async function readXlsx(buf){
  const JSZip=await lib('jszip'); const z=await JSZip.loadAsync(buf);
  const P=new DOMParser(); const xml=async p=>{ const f=z.file(p); return f? P.parseFromString(await f.async('string'),'application/xml') : null; };
  const wb=await xml('xl/workbook.xml'); if(!wb) throw new Error('الملف ليس ملف Excel بصيغة xlsx');
  const rels=await xml('xl/_rels/workbook.xml.rels'); const relMap={};
  if(rels) kids(rels,'Relationship').forEach(r=>{ relMap[r.getAttribute('Id')]=r.getAttribute('Target'); });

  if(ssDoc) kids(ssDoc,'si').forEach(si=>{ ss.push(kids(si,'t').filter(t=>!t.closest||!t.closest('rPh')).map(t=>t.textContent).join('')); });
  const out=[];
  for(const sh of kids(wb,'sheet')){
    const name=sh.getAttribute('name'); const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target=relMap[rid]; if(!target) continue;
    target = target.startsWith('/') ? target.slice(1) : ('xl/'+target).replace(/\/\.\//g,'/');
    const doc=await xml(target); if(!doc) continue;
    const grid=new Map();
    kids(doc,'c').forEach(c=>{
      const rc=refToRC(c.getAttribute('r')||''); if(!rc) return;
      const t=c.getAttribute('t'); const vEl=c.getElementsByTagName('v')[0]; let v=null;
      if(t==='s'){ if(vEl) v=ss[+vEl.textContent]??null; }
      else if(t==='inlineStr'){ v=kids(c,'t').map(x=>x.textContent).join(''); }
      else if(t==='str'||t==='e'){ v=vEl?vEl.textContent:null; }
      else if(t==='b'){ v=vEl?vEl.textContent==='1':null; }
      else if(vEl){ const n=parseFloat(vEl.textContent); v=isNaN(n)?vEl.textContent:n; }
      if(v!==null && v!=='') grid.set(rc.r*100000+rc.c, v);
    });
    out.push({name, grid});
  }
  return out;
}

/* ---------- import parser (works on the original layout and on exported files) ---------- */
function nrm(v){ return String(v??'').replace(/ـ/g,'').replace(/[ً-ْ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[0-9٠-٩]/g,'').replace(/\s+/g,' ').trim(); }
const NAME_RE=/^(اسم المنشاه الصحيه|اسم المنشاه|اسم المستشفي|تصنيف البلاغ)$/;
const STOP_RE=/^(اجمالي|اعلي|التصانيف|رضا المستفيد|مستوي الخدمه|نسبه البلاغات|متوسط الرضا|(ال)?(ل)?اسبوع|الربع|الشهر|الفتره)/;
function kindOf(n){ if(/عدد البلاغات/.test(n)||n==='المجموع') return 'count'; if(/متوسط الرضا/.test(n)) return 'avg'; if(/الرضا عن التواصل/.test(n)) return 'comm'; if(/الرضا عن الاجراء/.test(n)) return 'proc'; if(/داخل مستوي الخدمه/.test(n)) return 'pct'; return null; }
function parseSheet(name, grid){
  { const qq=qParseSheet(name,grid); if(qq) return qq; }
  const g=(r,c)=>grid.get(r*100000+c);
  const cells=[...grid.entries()].map(([k,v])=>({r:Math.floor(k/100000),c:k%100000,v,n:typeof v==='string'?nrm(v):''}));
  const tables={};
  cells.filter(x=>NAME_RE.test(x.n)).forEach(h=>{
    const kinds=[]; let j=h.c+1;
    while(true){ const v=g(h.r,j); if(v==null) break; const n=nrm(v); if(NAME_RE.test(n)) break; const k=kindOf(n); if(!k) break; kinds.push(k); j++; }
    if(!kinds.length) return;
    const entity = /تصنيف/.test(h.n) ? 'category' : (/المستشفي/.test(h.n) ? 'hospital' : 'facility');
    const metric = kinds.includes('pct') ? 'sl' : (kinds.includes('avg') ? 'sat' : 'count');
    const rows=[];
    for(let i=h.r+1;i<h.r+600;i++){
      const nm=g(i,h.c); if(nm==null||String(nm).trim()==='') break;
      if(NAME_RE.test(nrm(nm))) break;
      const vals=kinds.map((k,idx)=>g(i,h.c+1+idx));
      if(vals.every(v=>v==null||String(v).trim()==='') && STOP_RE.test(nrm(nm))) break;
      const row={name:String(nm).trim()==='—'?'':String(nm).trim()};
      kinds.forEach((k,idx)=>{ let n=toNum(vals[idx], RATIO.has(k)); if(k==='count'&&n!=null) n=Math.round(n); row[k]=n; });
      rows.push(row);
    }

  });
  Object.values(tables).forEach(l=>l.sort((a,b)=>a.c-b.c||a.r-b.r));
  const keys=Object.keys(tables);
  if(keys.length<2) return null;
  const type = keys.some(k=>k.startsWith('hospital-')) ? 'weekly' : 'hospital';
  const rep=newReport(type, name);
  defsOf(type).forEach(d=>{ const l=tables[d.key]; if(!l) return; [0,1].forEach(i=>{ if(l[i]) rep.sections[d.key].p[i].rows=l[i].rows; }); });
  // summaries: grouped by row, the leftmost of each row picks the section from the table beneath it
  const nearestBelow=(cell,metric)=>{ let best=null; Object.values(tables).flat().forEach(t=>{ if(t.metric===metric && t.c===cell.c && t.r>cell.r && (!best||t.r<best.r)) best=t; }); return best; };
  const assign=(found,metric,write)=>{
    const byRow={}; found.forEach(f=>{ (byRow[f.r]=byRow[f.r]||[]).push(f); });
    Object.values(byRow).forEach(list=>{ list.sort((a,b)=>a.c-b.c); const t=nearestBelow(list[0],metric); if(!t||!rep.sections[t.key]) return; const base=tables[t.key].indexOf(t); list.slice(0,2).forEach((f,i)=>{ const pi=Math.min(1,base+i); write(rep.sections[t.key].p[pi].summary,f,rep.sections[t.key].p[pi]); }); });
  };
  assign(cells.filter(x=>x.n==='اجمالي البلاغات' && toNum(g(x.r,x.c+1),false)!=null).map(x=>({r:x.r,c:x.c,v:Math.round(toNum(g(x.r,x.c+1),false))})),'count',(s,f,p)=>{ const sm=sumRows(p,'count'); if(sm==null || Math.round(sm)!==f.v) s.total=f.v; });
  assign(cells.filter(x=>/^نسبه البلاغات داخل مستوي الخدمه/.test(x.n)).map(x=>({r:x.r,c:x.c,v:toNum(g(x.r,x.c+1),true)})),'sl',(s,f)=>{ s.overall=f.v; });
  assign(cells.filter(x=>x.n==='متوسط الرضا' && /التواصل/.test(nrm(g(x.r,x.c+1))) && !NAME_RE.test(nrm(g(x.r,x.c-1)))).map(x=>({r:x.r,c:x.c,v:[0,1,2].map(i=>toNum(g(x.r+1,x.c+i),true))})),'sat',(s,f)=>{ s.avg=f.v[0]; s.comm=f.v[1]; s.proc=f.v[2]; });
  // period labels and dates
  const PER_RE=/^(ال)?(ل)?اسبوع|^الربع|^الشهر|^الفتره|^السنه|^النصف/;
  const firstPair=list=>{ if(!list.length) return null; const r=Math.min(...list.map(x=>x.r)); return list.filter(x=>x.r===r).sort((a,b)=>a.c-b.c).slice(0,2); };
  const pl=firstPair(cells.filter(x=>PER_RE.test(x.n)));
  if(pl) pl.forEach((x,i)=>{ rep.periods[i].label=String(x.v).trim(); });
  const dl=firstPair(cells.filter(x=>typeof x.v==='string' && /^\s*\d{1,2}\s*[-–]\s*\d{1,2}\s*\/\s*\d{1,2}/.test(x.v)));
  if(dl) dl.forEach((x,i)=>{ rep.periods[i].date=String(x.v).trim(); });
  return rep;
}
// v22: نوع الملف يُعرف من محتواه لا من اسمه، فلا يظهر رمادياً إذا غيّر الجوال أو البرنامج نوعه أو امتداده
async function fileKind(file){ const b=new Uint8Array(await file.slice(0,8).arrayBuffer());
  if(b[0]===0x50&&b[1]===0x4B) return 'xlsx'; if(b[0]===0xD0&&b[1]===0xCF&&b[2]===0x11&&b[3]===0xE0) return 'xls';
  let i=0; if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) i=3; while(i<b.length&&/\s/.test(String.fromCharCode(b[i]))) i++; if(b[i]===0x7B||b[i]===0x5B) return 'json'; return 'other'; }
function badFile(kind,file){ dialog({title:'لا يمكن قراءة هذا الملف', body:kind==='xls'
  ? `«${file.name}» محفوظ بصيغة Excel القديمة (.xls). افتحه في Excel واختر «حفظ باسم» ← «Excel Workbook (*.xlsx)»، ثم استورد الملف الجديد.`
  : `«${file.name}» ليس ملف Excel (.xlsx) ولا ملفاً من القاعدة. إن كان من Google Sheets فنزّله من «ملف ← تنزيل ← Microsoft Excel (.xlsx)».`, actions:[{label:'حسناً',cls:'primary'}]}); }
async function importFile(file){
  const kind=await fileKind(file);
  if(kind==='json') return importFromDb(file);
  if(kind!=='xlsx') return badFile(kind,file);
  let sheets;
  try{ sheets=await readXlsx(await file.arrayBuffer()); }
  catch(e){ console.error(e); toast(e.message||'تعذرت قراءة الملف'); return; }
  const parsed=sheets.map(s=>({s,r:parseSheet(s.name,s.grid)}));
  const reps=parsed.map(x=>x.r).filter(Boolean);
  const skipped=parsed.filter(x=>!x.r).map(x=>x.s.name);
  if(!reps.length){ dialog({title:'لم يُعثر على بيانات', body:'لم نجد جداول بالأعمدة المتوقعة (اسم المنشأة، عدد البلاغات، متوسط الرضا، داخل مستوى الخدمة…). تأكد من أن الملف بنفس قالب التقرير.', actions:[{label:'حسناً',cls:'primary'}]}); return; }
  const names=new Set(state.reports.map(r=>r.name));
  const same=reps.filter(r=>names.has(r.name)).length;
  dialog({title:`وُجد ${reps.length} تقرير في «${file.name}»`, html:`<ul>${reps.map(r=>`<li>${esc(r.name)} <small>(${TYPES[r.type].label})</small></li>`).join('')}</ul>${skipped.length?`<p>تُركت أوراق بلا جداول مطابقة: ${esc(skipped.join('، '))}</p>`:''}<p>${same?`${same} منها بنفس اسم تقرير موجود.`:''}</p>`,
    actions:[
      {label:'دمج مع الحالية',cls:'primary',run:()=>{ reps.forEach(r=>{ const i=state.reports.findIndex(x=>x.name===r.name); if(i>=0) state.reports[i]=r; else state.reports.push(r); }); state.current=Math.max(0,state.reports.findIndex(x=>x.name===reps[0].name)); save(); renderAll(); toast('تم الاستيراد'); }},
      {label:'استبدال الكل',run:()=>{ state.reports=reps; state.current=0; save(); renderAll(); toast('تم الاستيراد · بقيت إعداداتك كما هي'); }},
      {label:'إلغاء'}]});
}

function mountFit(el, w){
  const wrap=document.getElementById('fitwrap'); if(!wrap) return;
  wrap.innerHTML=''; const inner=document.createElement('div'); inner.className='fitin'; inner.style.width=w+'px';
  inner.appendChild(el); wrap.appendChild(inner); fitNow();
  setTimeout(fitNow,60);
}
function fitNow(){
  const wrap=document.getElementById('fitwrap'); if(!wrap || !wrap.firstChild) return;
  const inner=wrap.firstChild, w=parseFloat(inner.style.width), s=Math.min(1, wrap.clientWidth/w);
  inner.style.transform=`scale(${s})`;
  inner.style.right=Math.max(0,(wrap.clientWidth-w*s)/2)+'px';
  wrap.style.height=Math.ceil(inner.offsetHeight*s)+'px';
}

// نص @font-face بالخط مضمّناً (بصيغة data:) حتى يظهر الخط نفسه في الصورة وPDF
const RF_EMB={};
async function fontCss(fam='plex'){
  const F=RFONTS[fam]||RFONTS.plex; if(F.sys) return '';
  if(RF_EMB[fam]) return RF_EMB[fam];
  if(F.emb) return RF_EMB[fam]=document.getElementById('fontEmb')?.textContent||'';
  const fams = fam==='plex' ? [F.g,'Readex+Pro:wght@500;600;700'] : [F.g];
  try{
    let out='';
    for(const g of fams){
      const css=await (await fetch(`https://fonts.googleapis.com/css2?family=${g}&display=swap`)).text();
      const blocks=(css.match(/@font-face\s*{[^}]*}/g)||[]).filter(b=>!/unicode-range/.test(b)||/U\+0600|U\+0000-00FF/i.test(b));
      for(const blk of blocks){ const m=blk.match(/url\(([^)]+)\)/); if(!m) continue; const u=m[1].replace(/['"]/g,'');
        const d=await blobToDataUrl(await (await fetch(u)).blob()); out+=blk.replace(m[0],`url(${d})`)+'\n'; }
    }
    if(out) RF_EMB[fam]=out;
    return out;
  }catch(e){ console.warn('font embed',e); return ''; }
}
function imgRatio(el){
  const q=+(state.info&&state.info.q)||3;
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const maxA=ios?16e6:((navigator.deviceMemory||4)>=8?48e6:32e6);
  const area=Math.max(1,el.offsetWidth*el.offsetHeight);
  return Math.max(1,Math.min(q,Math.sqrt(maxA/area)));
}

  r++;

    put(r,0,'المؤشر',7); merge(r,0,r,1,7); put(r,2,P[1].label,7); put(r,3,P[0].label,7); put(r,4,'التغيّر',7); r++;
    const row=(lbl,a,b,isR,big=true)=>{ put(r,0,lbl,17); merge(r,0,r,1,17); put(r,2,b??null,isR?(big?19:10):18); put(r,3,a??null,isR?21:22); put(r,4,chg(a,b,isR),isR?15:14); heights[r]=big?24:18; r++; };

      if(k==='sat'){ row('متوسط رضا المستفيد',D.k.sat[0],D.k.sat[1],true);
        if(c.satParts){ if(D.sat[1].comm!=null) row('   الرضا عن التواصل',D.sat[0].comm,D.sat[1].comm,true,false); if(D.sat[1].proc!=null) row('   الرضا عن الإجراء',D.sat[0].proc,D.sat[1].proc,true,false); } }
      if(k==='sl') row('البلاغات داخل مستوى الخدمة',D.k.sl[0],D.k.sl[1],true);
    });
    r++;
  }
  const entL={hospital:'القطاع',facility:'المركز الصحي',category:'التصنيف'};
  for(let i=0;i<D.secs.length;i+=ncol){
    const chunk=D.secs.slice(i,i+ncol), top=r; let maxN=0;
    chunk.forEach((s,j)=>{
      const c0=j*(W+1), ts=s.metric==='count'?4:s.metric==='sat'?5:6;
      put(top,c0,s.title+(s.tot!=null?`  (${s.isRate?(s.tot*100).toFixed(2)+'%':igFi(s.tot)})`:''),ts); merge(top,c0,top,c0+W-1,ts); heights[top]=24;
      ['#',entL[s.entity],P[1].label,P[0].label,'التغيّر'].forEach((t,k)=>put(top+1,c0+k,t,7));
      s.rows.forEach((x,n)=>{ const rr=top+2+n;
        put(rr,c0,n+1,16); put(rr,c0+1,x.name,8);
        put(rr,c0+2,x.v??null,s.isRate?(s.metric==='sat'?satS(x.v):rateS(x.v)):9); put(rr,c0+3,x.p??null,s.isRate?21:22); put(rr,c0+4,chg(x.p,x.v,s.isRate),s.isRate?15:14); });
      if(!s.rows.length){ put(top+2,c0,'لا توجد بيانات',8); merge(top+2,c0,top+2,c0+W-1,8); }
      maxN=Math.max(maxN,s.rows.length||1);
      widths[c0]=5; widths[c0+1]=Math.max(widths[c0+1]||0, s.entity==='category'?44:30); widths[c0+2]=13; widths[c0+3]=13; widths[c0+4]=12; widths[c0+5]=2;
    });
    r=top+2+maxN+1;
  }
  const foot=[c.by&&'إعداد: '+c.by, c.sup&&'إشراف: '+c.sup, 'تاريخ الإعداد: '+D.date].filter(Boolean).join('   ·   ');
  put(r,0,foot,20); merge(r,0,r,last,20);
  for(let k=0;k<=4;k++) if(!widths[k]) widths[k]=[5,30,13,13,12][k];
  const byRow=new Map(); [...cells.values()].forEach(x=>{ if(!byRow.has(x.r)) byRow.set(x.r,[]); byRow.get(x.r).push(x); });
  const rowsXml=[...byRow.keys()].sort((a,b)=>a-b).map(rr=>`<row r="${rr}"${heights[rr]?` ht="${heights[rr]}" customHeight="1"`:''}>${byRow.get(rr).sort((a,b)=>a.c-b.c).map(x=>{ const ref=colName(x.c)+rr, s=x.s?` s="${x.s}"`:'';
      if(x.v===null||x.v===undefined||x.v==='') return `<c r="${ref}"${s}/>`;
      if(typeof x.v==='number') return `<c r="${ref}"${s}><v>${x.v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(x.v)}</t></is></c>`; }).join('')}</row>`).join('');
  const maxC=Math.max(...Object.keys(widths).map(Number)); let colsXml=''; for(let k=0;k<=maxC;k++) colsXml+=`<col min="${k+1}" max="${k+1}" width="${widths[k]||10}" customWidth="1"/>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView rightToLeft="1" showGridLines="0" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${colsXml}</cols><sheetData>${rowsXml}</sheetData>${merges.length?`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:''}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="${ncol>=3?'landscape':'portrait'}" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}
async function buildInfoXlsx(rep){
  if(rep.type==='quarterly') return buildXlsx([rep]);
  const JSZip=await lib('jszip'); const z=new JSZip();
  const nm=String(rep.name||'الإنفوجرافيك').replace(/[\[\]:*?\/\\]/g,'-').slice(0,31)||'الإنفوجرافيك';
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets><sheet name="${xe(nm)}" sheetId="1" r:id="rId1"/></sheets></workbook>`);
  z.file('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml',igXlsxStyles(state.info));
  z.file('xl/worksheets/sheet1.xml',igXlsxSheet(rep));
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
}

function igDefs(rep){
  const c=state.info, defs=defsOf(rep.type), o=c.order||[];
  return defs.map((d,i)=>({d,i})).sort((a,b)=>{ const x=o.indexOf(a.d.key), y=o.indexOf(b.d.key); return (x<0?1000+a.i:x)-(y<0?1000+b.i:y); }).map(o=>o.d);

function igTok(s,rep){

function igData(rep){
  const c=state.info, k=kpisOf(rep), defs=defsOf(rep.type);
  const strip=n=>c.strip?String(n||'').replace(/^\s*مركز\s+صحي\s+/,'').replace(/^\s*المراكز\s+(الصحية\s+)?التابعة\s+(لـ|ل|الى|إلى)\s*/,'').trim():String(n||'').trim();

    const S=rep.sections[d.key].p;
    const prev=new Map(S[0].rows.filter(r=>String(r.name||'').trim()).map(r=>[fold(r.name),r]));
    let rows=S[1].rows.filter(r=>String(r.name||'').trim()).map(r=>{ const pv=prev.get(fold(r.name)); return {name:strip(r.name), v:r[main], p:pv?pv[main]:null, n:r.count}; });
    if(!isRate) rows.sort((a,b)=>(b.v??-1)-(a.v??-1));

    else if(sc.ord==='desc') rows.sort((a,b)=>(b.v??-1)-(a.v??-1));

async function buildInfoPdf(rep){

    const cv=await snap(n, Math.min(3,imgRatio(n))), pdf=await PDFLib.PDFDocument.create();

    return new Blob([await pdf.save()],{type:'application/pdf'});

}

function onInputV2(t){

    if(d.cfg==='theme') document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed', s.dataset.theme.toLowerCase()===String(v).toLowerCase()));
    refreshInfo(); return true; }
  if(d.cfgsec!=null){ const h=new Set(state.info.hide); t.checked?h.delete(d.cfgsec):h.add(d.cfgsec); state.info.hide=[...h]; save(); refreshInfo(); return true; }
  if(d.rf!=null){ state.rf[d.rf]=+t.value; save(); renderBody(); return true; }
  if(d.rfs!=null){ state.rf[d.rfs]=t.value; save(); renderBody(); return true; }
  if(d.flt!=null){ pf[d.flt]=t.value; renderPTable(); return true; }
  if(d.psel!=null){ t.checked?psel.add(d.psel):psel.delete(d.psel); renderPTable(); return true; }
  if(d.pall!=null){ panelRows().forEach(o=>t.checked?psel.add(o.r.id):psel.delete(o.r.id)); renderPTable(); return true; }
  if(d.pvis!=null){ const r=state.reports[idxOf(d.pvis)]; if(r){ r.hidden=!t.checked; keepCurrent(()=>{}); afterPanelChange(); } return true; }
  if(d.openon!=null){ state.openOn=t.value; save(); toast('حُفظ التقرير الافتراضي'); return true; }
  if(d.auto!=null){ state.autosave=t.checked; if(state.autosave){ clearTimeout(saveTimer); const ok=persist(); setStatus(!ok); } else { persist(); setStatus(); } toast(state.autosave?'شُغّل الحفظ التلقائي':'أُوقف الحفظ التلقائي، استخدم زر «حفظ»'); return true; }
  return false;
}
function onClickV2(b){
  if(qClick(b)) return true;
  if(qiClick(b)) return true;
  if(igClick(b)) return true;
  const d=b.dataset;
  if(b.id==='btnUndo'||d.act==='undo'){ undo(); return true; }
  if(b.id==='btnRedo'||d.act==='redo'){ redo(); return true; }
  if(b.id==='btnSave'||d.act==='save-now'){ saveNow(); return true; }
  if(b.id==='btnSide'){ openSide(); return true; }
  if(d.pexp){ runExport(d.pexp); return true; }
  if(d.restore){ document.getElementById('dbInput').click(); return true; }
  if(d.exp==='backup'){ runExport('backup'); return true; }
  if(d.satdec!=null){ state.satDec=+d.satdec; save(); document.querySelectorAll('[data-satdec]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.satdec===d.satdec)); toast('حُفظت منازل الرضا'); return true; }
  if(d.themeset){ setTheme(d.themeset); document.querySelectorAll('[data-themeset]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.themeset===d.themeset)); return true; }
  if(d.theme){ state.info.theme=d.theme; save(); renderBody(); return true; }
  if(d.act==='info-reset'){ state.info={...INFO_DEF, hide:[]}; save(); renderBody(); toast('أُعيدت الإعدادات الافتراضية'); return true; }
  if(d.rfg){ const h=new Set(state.rf.hideGroups); h.has(d.rfg)?h.delete(d.rfg):h.add(d.rfg); state.rf.hideGroups=[...h]; save(); renderBody(); return true; }
  if(d.act==='rf-clear'){ state.rf={...RF_DEF, hideGroups:[], cmp:state.rf.cmp}; save(); renderBody(); return true; }
  if(d.act==='pf-clear'){ pf={q:'',type:'',src:'',vis:'',sort:''}; renderPanel(); return true; }
  if(d.pmove){ const [id,dir]=d.pmove.split(':'); const i=idxOf(id), j=i+(+dir); if(i<0||j<0||j>=state.reports.length) return true;
    keepCurrent(()=>{ const a=state.reports; [a[i],a[j]]=[a[j],a[i]]; }); afterPanelChange(); return true; }
  if(d.pdel){ const r=state.reports[idxOf(d.pdel)]; if(r) delReports([r.id], `حذف «${r.name}»؟`); return true; }
  if(d.pbulk){
    const ids=[...psel];
    if(d.pbulk==='none'){ psel.clear(); renderPTable(); return true; }
    if(d.pbulk==='show'||d.pbulk==='hide'){ state.reports.forEach(r=>{ if(psel.has(r.id)) r.hidden = d.pbulk==='hide'; }); keepCurrent(()=>{}); afterPanelChange(d.pbulk==='hide'?`أُخفي ${ids.length} تقرير`:`أُظهر ${ids.length} تقرير`); return true; }
    if(d.pbulk==='del'){ delReports(ids, 'حذف التقارير المحددة؟'); return true; }
    if(d.pbulk==='keep'){ delReports(state.reports.filter(r=>!psel.has(r.id)).map(r=>r.id), `إبقاء ${ids.length} تقرير وحذف الباقي؟`); return true; }
  }
  return false;
}

   كل صف: عدد البلاغات، متوسط الرضا، أكثر من 24 ساعة، خلال 24 ساعة

const Q_LABELS=['الربع الرابع 2025','الربع الأول 2026','الربع الثاني 2026','الربع الثالث 2026'];
const QN_AR=['الربع الأول','الربع الثاني','الربع الثالث','الربع الرابع'];
const Q_DEF_YN=[[2025,4],[2026,1],[2026,2],[2026,3]];
function qYN(label){ const L=String(label||''); const y=(L.match(/(20\d\d)/)||[])[1]; const i=QN_AR.findIndex(x=>L.includes(x.replace('الربع ','')));
  return y&&i>=0?{y:+y,n:i+1}:null; }
const qOrd=q=> (q.y&&q.n) ? q.y*10+q.n : null;
const QF=['count','sat','within','o48'];
const QX=['op48']; // للقطاع وملخص الربع فقط
window.QF_=QF;
const QDUR=['over','within','o48','op48','s48'];
const QF_L={count:'عدد البلاغات',sat:'متوسط الرضا %',within:'خلال 48 ساعة',o48:'أكثر من 48 ساعة',op48:'مفتوحة أكثر من 48 ساعة'};
const qRow=(name='')=>({name,count:null,sat:null,over:null,within:null,o48:null,op48:null,s48:null});
const qEmpty=(label,show,y,n)=>({label,y:y||null,n:n||null,date:'',show,sum:{count:null,sat:null,over:null,within:null},hos:[],cats:[]});
function newQuarterly(name){
  return {id:uid(), name:name||'التقرير الربعي', type:'quarterly', qs:Q_DEF_YN.map(([y,n],i)=>qEmpty(`${QN_AR[n-1]} ${y}`,i>0,y,n)), periods:[], sections:{}};
}
function normQ(r){
  r.id=r.id||uid(); r.sections={};
  r.qs=(r.qs||[]).slice(0,16); if(!r.qs.length) r.qs=newQuarterly().qs;
  const num=v=>{ const n=toNum(v,false); return n==null?null:n; }, pct=v=>{ const n=toNum(v,true); return n==null?null:n; };
  const fix=o=>{ o.name=String(o.name??''); o.count=num(o.count); o.sat=pct(o.sat); QDUR.forEach(k=>o[k]=num(o[k])); qFold(o); return o; };
  r.qs.forEach((q,i)=>{ q.label=q.label||(q.y&&q.n?`${QN_AR[q.n-1]} ${q.y}`:`ربع ${i+1}`); q.date=q.date||''; if(typeof q.show!=='boolean') q.show=i>0;
    if(!(q.y>2000&&q.n>=1&&q.n<=4)){ const yn=qYN(q.label); q.y=yn?yn.y:null; q.n=yn?yn.n:null; }
    delete q.recs;
    { const S=q.sum||{}; q.sum={count:num(S.count),sat:pct(S.sat)}; QDUR.forEach(k=>q.sum[k]=num(S[k])); qFold(q.sum); }
    q.hos=(q.hos||[]).map(h=>{ fix(h); h.centers=(h.centers||[]).map(fix); h.cats=(h.cats||[]).map(fix); return h; });
    q.cats=(q.cats||[]).map(fix); });
  if(r.qs.every(q=>qOrd(q))) r.qs.sort((a,b)=>qOrd(a)-qOrd(b));
  const sh=r.qs.filter(q=>q.show), L=r.qs;
  r.periods=[{label:(sh[0]||L[0]).label,date:''},{label:(sh[sh.length-1]||L[L.length-1]).label,date:''}];
  return r;
}
/* totals: an empty cell falls back to the sum of the rows below it */
const qSum=(L,k)=>{ let s=0,n=0; L.forEach(x=>{ if(typeof x[k]==='number'){ s+=x[k]; n++; } }); return n?s:null; };
const qWAvg=(L)=>{ let s=0,w=0,n=0,u=0; L.forEach(x=>{ if(typeof x.sat==='number'){ n++; u+=x.sat; if(typeof x.count==='number'&&x.count>0){ s+=x.sat*x.count; w+=x.count; } } }); return w?s/w:(n?u/n:null); };
function qHos(h){ const C=h.centers||[], o={name:h.name, count:h.count??qSum(C,'count'), sat:h.sat??qWAvg(C)}; QDUR.forEach(k=>o[k]=h[k]??qSum(C,k)); return o; }
function qTot(q){ const H=q.hos.map(qHos), o={count:q.sum.count??qSum(H,'count'), sat:q.sum.sat??qWAvg(H)}; QDUR.forEach(k=>o[k]=q.sum[k]??qSum(H,k)); return o; }

/* ---------- comparisons ---------- */
function qPrevMaps(rep, qi){
  const P=qi>0?rep.qs[qi-1]:null; if(!P) return null;
  const H=new Map(), C=new Map(), K=new Map(), HK=new Map();
  P.hos.forEach(h=>{ const hh=qHos(h); H.set(fold(h.name),hh); h.centers.forEach(c=>C.set(fold(h.name)+'|'+fold(c.name),c)); (h.cats||[]).forEach(c=>HK.set(fold(h.name)+'|'+fold(c.name),c)); });
  P.cats.forEach(c=>K.set(fold(c.name),c));
  return {H,C,K,HK,T:qTot(P),label:P.label};
}
function qChg(a,b,kind){ // kind: count | sat | over(نسبة أكثر من 24 ساعة)
  if(a==null||b==null) return '';
  const d=b-a; if(Math.abs(d)<1e-9) return '<span class="pl pz">● 0</span>';
  const up=d>0; let good, t;
  if(kind==='count'){ good=!up; t= a? Math.abs(d/a*100).toFixed(0)+'%' : fmtInt(Math.abs(d)); }
  else if(kind==='sat'){ good=up; t=Math.abs(d*100).toFixed(1)+' ن'; }
  else { good=!up; t=Math.abs(d*100).toFixed(1)+' ن'; }
  return `<span class="pl ${good?'pg':'pb'}">${up?'▲':'▼'} ${t}</span>`;
}

  const upd=(t,s)=>{ t.count=s.count; QDUR.forEach(k=>{ if(k in s) t[k]=s[k]; }); qFold(t); t.db=1; };
  inc.qs.forEach(iq=>{
    const tq=qFind(T.qs,iq);
    if(!tq){ if(qHas(iq)||!T.qs.length){ T.qs.push(qMarkDb(JSON.parse(JSON.stringify(iq)))); st.added.push(iq.label); } return; }
    if(!qHas(iq)){ st.kept.push(tq.label); return; }
    if(iq.date) tq.date=iq.date;
    upd(tq.sum,iq.sum);
    // 1) المركز الذي صار في القاعدة تحت قطاع آخر يُنقل إليه بالرضا الذي عُبّئ له
    const home=new Map(); iq.hos.forEach(h=>h.centers.forEach(c=>{ if(!home.has(F(c.name))) home.set(F(c.name),h); }));
    tq.hos.slice().forEach(th=>{ th.centers=th.centers.filter(tc=>{ const ih=home.get(F(tc.name)); if(!ih||F(ih.name)===F(th.name)) return true;
      let dest=tq.hos.find(x=>F(x.name)===F(ih.name)); if(!dest){ dest={...qRow(ih.name),centers:[],cats:[],db:1}; tq.hos.push(dest); }
      const ex=dest.centers.find(x=>F(x.name)===F(tc.name)); if(ex){ if(ex.sat==null&&tc.sat!=null) ex.sat=tc.sat; } else dest.centers.push(tc);
      st.moved.push(`${tq.label}: «${tc.name}» من ${th.name} إلى ${dest.name}`); return false; }); });
    // 2) التحديث والإضافة
    iq.hos.forEach(h=>{ let th=tq.hos.find(x=>F(x.name)===F(h.name));
      if(!th){ th={...qRow(h.name),centers:[],cats:[]}; tq.hos.push(th); } upd(th,h);
      h.centers.forEach(c=>{ let tc=th.centers.find(x=>F(x.name)===F(c.name)); if(!tc){ tc=qRow(c.name); th.centers.push(tc); } upd(tc,c); });
      if(!th.cats) th.cats=[]; (h.cats||[]).forEach(c=>{ let tc=th.cats.find(x=>F(x.name)===F(c.name)); if(!tc){ tc=qRow(c.name); th.cats.push(tc); } upd(tc,c); }); });
    iq.cats.forEach(c=>{ let tc=tq.cats.find(x=>F(x.name)===F(c.name)); if(!tc){ tc=qRow(c.name); tq.cats.push(tc); } upd(tc,c); });
    // 3) المركز الذي جاء من القاعدة ولم يعد فيها (تحت قطاع موجود في الملف) يُحذف
    if(del) tq.hos.forEach(th=>{ const ih=iq.hos.find(x=>F(x.name)===F(th.name)); if(!ih) return;
      th.centers=th.centers.filter(tc=>{ if(tc.db&&!ih.centers.some(c=>F(c.name)===F(tc.name))){ st.removed.push(`${tq.label}: «${tc.name}» من ${th.name}`); return false; } return true; }); });
    st.updated.push(tq.label); });
  T.source='db'; normQ(T); return st;
}
function qmWire(r){ const sel=document.getElementById('qmT'), P=document.getElementById('qmP'); if(!sel) return;
      const prev=()=>{ const T=state.reports.find(x=>x.id===sel.value); if(!T){ P.innerHTML='يُضاف تقريراً جديداً، وتبقى تقاريرك كما هي.'; return; }
        const D=JSON.parse(JSON.stringify(T)); const st=qMergeInto(D,{qs:r.qs.map(q=>{ const c=JSON.parse(JSON.stringify(q)); delete c._n; return c; })});
        const L=(t,a)=>a.length?`<b>${t}:</b> ${a.map(esc).join('، ')}<br>`:'';
        P.innerHTML=`${L('يُضاف',st.added)||'<b>يُضاف:</b> لا شيء<br>'}${L('تتحدّث أعداد البلاغات ومدة الإغلاق في',st.updated)}${L('يبقى كما هو',st.kept)}${L('يُنقل لأن قطاعه تغيّر في القاعدة (مع الرضا)',st.moved)}${L('يُحذف لأنه لم يعد في القاعدة',st.removed)}<span>متوسط الرضا الذي عبّأته لا يتغير، والصفوف التي أضفتها يدوياً لا تُحذف.</span>`; };
      sel.addEventListener('change',prev); prev(); }
function qImportBridge(data){
  const inc=JSON.parse(JSON.stringify(data.report)); (inc.qs||[]).forEach((q,i)=>{ q._n=(data.counts||[])[i]||0; });
  const r=normQ({...inc, id:uid(), source:'db', type:'quarterly'});
  let base=r.name||'التقرير الربعي', name=base, n=2; const names=new Set(state.reports.map(x=>x.name)); while(names.has(name)) name=`${base} (${n++})`; r.name=name;
  const QR=state.reports.filter(x=>x.type==='quarterly');
  const def=cur()&&cur().type==='quarterly'?cur().id:(QR.length?QR[QR.length-1].id:'');
  const list=`<ul>${r.qs.map(q=>`<li>${esc(q.label)}: ${q._n?fmtInt(q._n)+' بلاغ':'فارغ'}${q.show?'':' · للمقارنة فقط'}</li>`).join('')}</ul>`;
  dialog({title:'استيراد تقرير ربعي من القاعدة', html:`${list}
    <div class="field"><label for="qmT">أين أضعه؟</label><select class="inp" id="qmT"><option value="">تقرير ربعي جديد «${esc(name)}»</option>${QR.map(x=>`<option value="${x.id}" ${x.id===def?'selected':''}>دمج مع «${esc(x.name)}» (${x.qs.length} ربع)</option>`).join('')}</select></div>
    <div id="qmP" class="hint" style="margin:0"></div>
    <p class="hint">${data.dur?'':'لم يكن في القاعدة «تاريخ الحل» فبقيت مدة الإغلاق للتعبئة. '}متوسط الرضا لا يوجد في القاعدة، فعبّئه في صفحة الإدخال للأرباع الجديدة.</p>`,

    actions:[{label:'تنفيذ',cls:'primary',run:()=>{ const id=(document.getElementById('qmT')||{}).value||'';
      if(!id){ r.qs.forEach(q=>{ delete q._n; qMarkDb(q); }); state.reports.push(r); state.current=state.reports.length-1; view='edit'; qIdx=0; save(); renderAll(); toast('أُضيف التقرير الربعي'); return; }
      const T=state.reports.find(x=>x.id===id); const st=qMergeInto(T,{qs:r.qs.map(q=>{ const c=JSON.parse(JSON.stringify(q)); delete c._n; return c; })});
      state.current=state.reports.indexOf(T); view='edit'; qIdx=st.added.length?Math.max(0,T.qs.findIndex(q=>q.label===st.added[st.added.length-1])):qIdx; save(); renderAll();
      toast(`دُمج: ${st.added.length} ربع جديد، و${st.updated.length} ربع تحدّث${st.moved.length?`، ونُقل ${st.moved.length} مركز`:''}${st.removed.length?`، وحُذف ${st.removed.length}`:''}`); }},{label:'إلغاء'}]});
  setTimeout(()=>{ const sel=document.getElementById('qmT'); if(sel&&!sel._w){ sel._w=1; qmWire(r); } },0);
}
